<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>

  <!-- subtle outer ring accent -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- thin inner frame -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.25"/>

  <!-- Monogram F, custom geometric letterform -->
  <g filter="url(#glow)">
    <path d="
      M 190 140
      L 190 372
      L 232 372
      L 232 276
      L 316 276
      L 316 236
      L 232 236
      L 232 180
      L 330 180
      L 330 140
      Z
    " fill="url(#fGrad)"/>
  </g>

  <!-- fine accent line under the F -->
  <rect x="190" y="392" width="140" height="4" rx="2" fill="url(#fGrad)" opacity="0.85"/>
</svg>
